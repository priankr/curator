<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>filter</title></head>
<body style="margin:0;background:#333;color:#eee;font:12px monospace">
<pre id="R">pending</pre>
<script src="harness.js"></script>
<script>
// The all chip leads and is pressed with no filter. A tag chip dims the slides without that tag, and all or a second click clears it.
H.run('filter', async (t) => {
  const site = await t.site();
  const col = site.collections.find((c) => c.id === site.defaultCollection);
  const c = await t.load('/');
  const chips = c.$$('.cu-chip');
  const all = chips[0];
  const pressed = (b) => b && b.getAttribute('aria-pressed');
  const dimmed = () => c.$$('.slide.dim').length;
  t.check('all is the first chip', !!all && all.textContent === 'all' && all.dataset.tag === '', all && all.textContent);
  t.check('there is no Filter label', !c.$('.cu-chips-label'));
  t.check('all is pressed on load', pressed(all) === 'true', pressed(all));
  const chip = chips.find((b) => { const n = col.items.filter((i) => i.tags.includes(b.dataset.tag)).length; return b.dataset.tag && n > 0 && n < col.items.length; });
  t.check('a partial tag chip exists', !!chip, chips.length + ' chips');
  if (!chip || !all) return;
  const tag = chip.dataset.tag;
  chip.click();
  await t.sleep(200);
  const want = col.items.map((i, n) => (i.tags.includes(tag) ? -1 : n)).filter((n) => n >= 0);
  const got = c.slides().map((s, n) => (s.classList.contains('dim') ? n : -1)).filter((n) => n >= 0);
  t.check('exactly the non-matching slides are dimmed', JSON.stringify(want) === JSON.stringify(got), 'tag=' + tag + ' want=' + want.length + ' got=' + got.length);
  t.check('chip is pressed', pressed(chip) === 'true', pressed(chip));
  t.check('all is not pressed', pressed(all) === 'false', pressed(all));
  all.click();
  await t.sleep(200);
  t.check('nothing is dimmed after all is clicked', dimmed() === 0, dimmed());
  t.check('all is pressed again', pressed(all) === 'true', pressed(all));
  t.check('the tag chip is not pressed', pressed(chip) === 'false', pressed(chip));
  all.click();
  await t.sleep(100);
  t.check('clicking all again keeps it pressed and nothing dimmed', pressed(all) === 'true' && dimmed() === 0, pressed(all) + ' ' + dimmed());
  chip.click();
  await t.sleep(200);
  chip.click();
  await t.sleep(200);
  t.check('nothing is dimmed after the active tag is clicked again', dimmed() === 0, dimmed());
  t.check('the tag chip is not pressed after the second click', pressed(chip) === 'false', pressed(chip));
  t.check('all is pressed after the second click', pressed(all) === 'true', pressed(all));
  // The plate says when matches sit on another page, and clears with the filter.
  const note = c.$('.table.on .tb-more'), size = site.scene.pageSize;
  const other = col.items.map((i, n) => ({ n, tags: i.tags })).filter((x) => x.n >= size);
  const far = chips.find((b) => b.dataset.tag && other.some((x) => x.tags.includes(b.dataset.tag)) && col.items.slice(0, size).some((i) => i.tags.includes(b.dataset.tag)));
  t.check('the note is hidden with no filter', !!note && note.hidden, note && note.hidden);
  t.check('a tag spans pages', !!far, 'none of the sample tags appears on both the first page and a later one');
  if (!far || !note) return;
  far.click();
  await t.sleep(200);
  const total = col.items.filter((i) => i.tags.includes(far.dataset.tag)).length;
  t.check('the note names the count and points to other pages', !note.hidden && note.textContent === 'Tagged: ' + total + '. More on other pages', note.textContent);
  far.click();
  await t.sleep(200);
  t.check('the note clears with the filter', note.hidden, note.hidden);
  // At phone width the note sits inside the glass above the first slide, wraps if it must, and the table grows to hold it.
  const p = await t.load('/?still=1', 360, 844);
  p.$$('.cu-chip').find((b) => b.dataset.tag === far.dataset.tag).click();
  await t.sleep(400);
  const rect = (sel) => p.$('.table.on ' + sel).getBoundingClientRect(), n = rect('.tb-more'), g = rect('.tb-glass'), s1 = rect('.slide:not(.off)');
  t.check('the note sits above the glass inside the frame', n.top >= g.top && n.left >= g.left && n.right <= g.right && n.bottom <= s1.top, [g.top, n.top, n.bottom, s1.top].map(Math.round).join(' '));
  const gap = () => p.$('.table.on .slide:not(.off)').getBoundingClientRect().top;
  const before = s1.top;
  p.$$('.cu-chip')[0].click();
  await t.sleep(300);
  t.check('the first slide does not move when the note goes away', Math.abs(gap() - before) < 1 && p.$('.table.on .tb-more').hidden, Math.round(before) + ' ' + Math.round(gap()));
  const l = p.$('#chips-l'), r = p.$('#chips-r'), ch = p.$$('.cu-chip')[1], mid = (e) => e.getBoundingClientRect().top + e.getBoundingClientRect().height / 2;
  t.check('both tag chevrons show and sit level with the tags', !l.hidden && !r.hidden && Math.abs(mid(l) - mid(ch)) < 1 && Math.abs(mid(r) - mid(ch)) < 1, Math.round(mid(l)) + ' ' + Math.round(mid(r)) + ' ' + Math.round(mid(ch)));
});
</script>
</body></html>
