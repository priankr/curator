<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>types</title></head>
<body style="margin:0;background:#333;color:#eee;font:12px monospace">
<pre id="R">pending</pre>
<script src="harness.js"></script>
<script>
// Runs on a build that renames repo to Project and gives it the dot role accent.1.
H.run('types', async (t) => {
  const site = await t.site();
  const col = site.collections.find((x) => x.items.some((i) => i.type === 'repo'));
  const item = col.items.find((i) => i.type === 'repo');
  const hex = site.brand.accent[1].value.replace('#', '');
  const rgb = 'rgb(' + [0, 2, 4].map((i) => parseInt(hex.slice(i, i + 2), 16)).join(', ') + ')';
  const c = await t.load('/' + col.id + '/');
  const slide = c.slides().find((s) => s.classList.contains('t-repo'));
  t.check('a repo slide is on the table', !!slide);
  t.check('slide top label reads Project', c.$('.lb-top b', slide).textContent === 'Project', c.$('.lb-top b', slide).textContent);
  t.check('slide aria-label contains project', slide.getAttribute('aria-label').includes('project'), slide.getAttribute('aria-label'));
  t.check('dot colour is accent 2', c.w.getComputedStyle(c.$('.dot', slide)).backgroundColor === rgb, c.w.getComputedStyle(c.$('.dot', slide)).backgroundColor + ' vs ' + rgb);
  const li = c.$$('nav.sr-only li').find((x) => c.$('h3', x).textContent === item.title);
  t.check('screen reader list says Project', !!li && c.$('p', li).textContent === 'Project', li && c.$('p', li).textContent);
  slide.click();
  await t.waitFor(c.isOpen, 15000);
  t.check('screen kicker reads Project', c.$('.cp-kick').textContent === 'Project', c.$('.cp-kick') && c.$('.cp-kick').textContent);
  const hexRgb = (h) => 'rgb(' + [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)).join(', ') + ')';
  const wt = site.types.find((x) => x.name === 'webpage');
  t.check('webpage is a registered type labelled Webpage and article is too', !!wt && wt.label === 'Webpage' && site.types.some((x) => x.name === 'article' && x.label === 'Article'));
  t.check('the webpage dot variable is primary 1', c.w.getComputedStyle(c.w.document.documentElement).getPropertyValue('--dot-webpage').trim().toLowerCase() === site.brand.primary[0].value.toLowerCase());
  t.check('the article dot variable is primary 3', c.w.getComputedStyle(c.w.document.documentElement).getPropertyValue('--dot-article').trim().toLowerCase() === site.brand.primary[2].value.toLowerCase());
  // Slides of each type are checked only when the real content has one.
  const wcol = site.collections.find((x) => x.items.some((i) => i.type === 'webpage'));
  if (wcol) {
    const wc = await t.load('/' + wcol.id + '/');
    const wslide = wc.slides().find((s) => s.classList.contains('t-webpage'));
    t.check('an untyped link is labelled Webpage', !!wslide && wc.$('.lb-top b', wslide).textContent === 'Webpage');
    t.check('webpage dot is primary 1', !!wslide && wc.w.getComputedStyle(wc.$('.dot', wslide)).backgroundColor === hexRgb(site.brand.primary[0].value));
  }
  const acol = site.collections.find((x) => x.items.some((i) => i.type === 'article'));
  if (acol) {
    const ac = await t.load('/' + acol.id + '/');
    const aslide = ac.slides().find((s) => s.classList.contains('t-article'));
    t.check('an item with type article is labelled Article', !!aslide && ac.$('.lb-top b', aslide).textContent === 'Article', aslide && ac.$('.lb-top b', aslide).textContent);
    t.check('article dot is primary 3', !!aslide && ac.w.getComputedStyle(ac.$('.dot', aslide)).backgroundColor === hexRgb(site.brand.primary[2].value));
  }
  t.check('the real content has at least one webpage or article slide to check', !!(wcol || acol));
});
</script>
</body></html>
